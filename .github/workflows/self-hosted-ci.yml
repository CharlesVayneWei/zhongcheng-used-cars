name: Validate self-hosted Next.js

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: test-and-build
    runs-on: ubuntu-latest
    outputs:
      schema_change: ${{ steps.schema.outputs.changed }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhongcheng_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zhongcheng_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongcheng_test -d zhongcheng_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_DEMO_MODE: 'false'
      NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'http://localhost:3000' }}
    steps:
      - name: Check out commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests including PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgresql://zhongcheng_test:ci-only-password@127.0.0.1:5432/zhongcheng_test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Check deployment script and rollback behavior
        run: |
          bash -n scripts/deploy.sh scripts/deploy-from-actions.sh
          bash tests/deploy-script-smoke.sh

      - name: Build standalone production server
        run: pnpm build

      - name: Detect database migrations in this push
        id: schema
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- database/migrations | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Database migration changed: automatic deployment is paused for this push'
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Package release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          test -f .next/standalone/server.js
          tar -C .next/standalone -czf "$RUNNER_TEMP/zhongcheng-release.tar.gz" .
          if tar -tzf "$RUNNER_TEMP/zhongcheng-release.tar.gz" | grep -Eq '(^|/)\.env($|\.)'; then
            echo 'Release archive unexpectedly contains an environment file' >&2
            exit 1
          fi

      - name: Upload tested release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: zhongcheng-release
          path: ${{ runner.temp }}/zhongcheng-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy after verification
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.PRODUCTION_SITE_URL != '' &&
      (github.event_name == 'workflow_dispatch' || needs.verify.outputs.schema_change == 'false')
    uses: ./.github/workflows/deploy.yml
